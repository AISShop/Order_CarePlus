<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care Plus Daily Performance — Area South</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --green:#0A5C36; --green-2:#1E8C5A; --lime:#8DC63F; --mist:#EEF5E6; --sage:#C9DDB8;
  --ink:#1F2A24; --muted:#5B6B63; --line:#D5DED8; --zebra:#F4F8F0; --bg:#FFFFFF; --warn:#9A5B00; --warn-bg:#FFF4DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,"Leelawadee UI",sans-serif;font-size:15px;line-height:1.5}
header.top{background:var(--green);color:#fff;padding:28px 20px 30px}
.wrap{max-width:980px;margin:0 auto}
h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--sage)}
main{padding:24px 20px 60px}
.drop{display:block;border:2px dashed var(--sage);border-radius:14px;padding:28px 20px;text-align:center;background:var(--mist);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--green-2);background:#E3F0D6}
.drop:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.drop strong{display:block;font-size:17px;color:var(--green)}
.drop span{color:var(--muted);font-size:14px}
.locs{margin:14px 0 0;color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:26px 0 8px}
.bar .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;font-size:14px;padding:7px 10px;border:1.5px solid var(--sage);border-radius:8px;background:#fff;color:var(--ink)}
select:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.btn-main{background:var(--green);color:#fff}
.btn-main:hover{background:#084a2c}
.btn-ghost{background:transparent;color:var(--green);border:1.5px solid var(--sage)}
.btn-ghost:hover{background:var(--mist)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0 0}
.error{background:#FDE8E8;color:#9B1C1C;border-radius:10px;padding:10px 14px;margin:14px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;color:var(--green);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12.5px}
.kpi.free .v{color:var(--green-2)}
h2{font-size:20px;color:var(--green);margin:30px 0 10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;text-align:center}
thead tr:first-child th{color:#fff}
th.g{background:var(--green);color:#fff}
th.f{background:var(--lime);color:var(--ink)!important}
th.y{background:var(--green-2);color:#fff}
th.f2{background:var(--sage);color:var(--ink)}
th.left{text-align:left}
td.n{text-align:right}
td.c{text-align:center;color:var(--muted)}
td.b{font-weight:600}
td.z{color:#9AA59F}
tbody tr:nth-child(even) td{background:var(--zebra)}
tfoot td{background:var(--mist);font-weight:700}
.foot{color:var(--muted);font-size:13px;margin-top:18px}
[hidden]{display:none!important}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>Care Plus Daily Performance</h1>
  <p class="sub">AIS Shop Area South · Import Excel / CSV → Export PowerPoint (ข้อมูลไม่ถูกเก็บ รีเฟรชแล้วหาย)</p>
</div></header>

<main class="wrap">
  <label class="drop" id="drop" tabindex="0">
    <strong>เลือกไฟล์ Care Plus (Excel หรือ CSV)</strong>
    <span>รองรับไฟล์ Excel รายวัน (Product Name…) หรือ CSV รายเดือน AIS_Care_Plus_AIS_Shop_YYYYMM.csv — ลากมาวางหรือคลิกเพื่อเลือก</span>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  </label>
  <p class="locs" id="locList"></p>
  <div id="err" class="error" hidden></div>

  <section id="result" hidden>
    <div class="bar">
      <div class="meta"><label for="dateSel">วันที่</label> <select id="dateSel"></select> <span id="meta"></span></div>
      <div class="actions">
        <button class="btn-ghost" id="btnClear" type="button">ล้างข้อมูล</button>
        <button class="btn-main" id="btnExport" type="button">Export PowerPoint</button>
      </div>
    </div>
    <div id="warn" class="notice" hidden></div>
    <div class="kpis" id="kpis"></div>
    <h2>By Location</h2>
    <div class="tbl"><table id="tLoc"></table></div>
    <h2>By Staff</h2>
    <div class="tbl"><table id="tStaff"></table></div>
    <p class="foot">Rev.: Free = ค่าบริการรายเดือนหลัง Free1M, 12M = ราคารายปี (ดึงจาก Product Name)</p>
  </section>
</main>

<script>
/* ===== CORE (no DOM) ===== */
const LOCATIONS = {
  '1204': { name: 'Shop Central Surat Thani', short: 'Surat Thani' },
  '1205': { name: 'Shop Central Hat Yai', short: 'Central Hat Yai' },
  '1213': { name: 'Shop Central Phuket Floresta', short: 'Phuket Floresta' },
  '1215': { name: 'Shop Central Nakhon Si Thammarat', short: 'Nakhon Si Thammarat' },
  '1216': { name: 'Shop Central Samui', short: 'Samui' },
  '1245': { name: 'Shop Serenade Club Central Festival Hat Yai', short: 'Serenade Festival Hat Yai' },
  '1252': { name: 'Shop Hatyai Village', short: 'Hatyai Village' },
  '1255': { name: 'Shop Central Phuket Festival', short: 'Phuket Festival' },
  '1259': { name: 'AIS SHOP Robinson Trang', short: 'Robinson Trang' }
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = n => Number(n).toLocaleString('en-US');

function parseProduct(name) {
  const p = String(name || '');
  let m = p.match(/Free\s*1M\s*(\d[\d,]*)/i);
  if (m) return { term: 'Free', price: +m[1].replace(/,/g, '') };
  if (/12\s*M(onths)?\b/i.test(p)) {
    m = p.match(/(\d[\d,]{2,})\s*B/i);
    if (m) return { term: '12M', price: +m[1].replace(/,/g, '') };
  }
  if (/Monthly/i.test(p)) {            // e.g. "Care Plus with Samsung Care 299B Monthly" → counted as Free (monthly)
    m = p.match(/(\d[\d,]*)\s*B/i);
    if (m) return { term: 'Free', price: +m[1].replace(/,/g, '') };
  }
  return null;
}

// Normalise to {d,m,y}; source files use dd/mm/yyyy
function parseDate(v) {
  if (v instanceof Date && !isNaN(v)) return { d: v.getDate(), m: v.getMonth() + 1, y: v.getFullYear() };
  if (typeof v === 'number' && typeof XLSX !== 'undefined') { const o = XLSX.SSF.parse_date_code(v); if (o) return { d: o.d, m: o.m, y: o.y }; }
  const m = String(v || '').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; if (y > 2400) y -= 543; return { d: +m[1], m: +m[2], y }; }
  return null;
}
const dKey = o => o.y * 10000 + o.m * 100 + o.d;
const dTxt = o => String(o.d).padStart(2, '0') + ' ' + MONTHS[o.m - 1] + ' ' + o.y;
function dateLabel(dates) {
  if (!dates.length) return '-';
  dates.sort((a, b) => dKey(a) - dKey(b));
  const a = dates[0], b = dates[dates.length - 1];
  if (dKey(a) === dKey(b)) return dTxt(a);
  if (a.m === b.m && a.y === b.y) return String(a.d).padStart(2, '0') + '–' + dTxt(b);
  return dTxt(a) + ' – ' + dTxt(b);
}
function fileDate(dates) {
  if (!dates.length) return 'NoDate';
  const b = dates[dates.length - 1];
  return String(b.d).padStart(2, '0') + MONTHS[b.m - 1] + b.y;
}

// Step 1: rows (array of arrays) → normalised records. Supports
//   (A) Daily Excel: Product Name / Location Code / Username / Order Date
//   (B) Monthly CSV:  order_promotion_name / location_cd / emp_login / order_completed_dt / order_num
function parseRows(rows) {
  const norm = s => String(s == null ? '' : s).replace(/^\uFEFF/, '').trim().toLowerCase().replace(/\s+/g, ' ');
  const PROD = ['product name', 'order_promotion_name'];
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) if ((rows[i] || []).some(c => PROD.includes(norm(c)))) { hi = i; break; }
  if (hi < 0) throw new Error('ไม่พบคอลัมน์ "Product Name" หรือ "order_promotion_name" — ตรวจสอบว่าเป็นไฟล์ Care Plus ที่ถูกต้อง');
  const H = rows[hi].map(norm);
  const col = (...names) => { for (const n of names) { const i = H.indexOf(n); if (i >= 0) return i; } return -1; };
  const cP = col(...PROD), cL = col('location code', 'location_cd'), cU = col('username', 'emp_login', 'user name'),
        cD = col('order date', 'order_completed_dt', 'trade_date'), cO = col('order_num', 'order number', 'order no');
  const miss = [['Location Code / location_cd', cL], ['Username / emp_login', cU]].filter(x => x[1] < 0).map(x => x[0]);
  if (miss.length) throw new Error('ไม่พบคอลัมน์: ' + miss.join(', '));
  const format = H.includes('order_promotion_name') ? 'CSV รายเดือน (MTD)' : 'Excel รายวัน';
  const recs = []; const seen = new Set();
  let total = 0, outside = 0, dup = 0; const unknown = {};
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || r.every(c => c === '' || c == null)) continue;
    total++;
    const code = String(r[cL] == null ? '' : r[cL]).trim().replace(/\.0+$/, '');
    if (!LOCATIONS[code]) { outside++; continue; }
    if (cO >= 0) { const on = String(r[cO] || '').trim(); if (on) { if (seen.has(on)) { dup++; continue; } seen.add(on); } }
    const pr = parseProduct(r[cP]);
    if (!pr) { const k = String(r[cP] || '(ว่าง)'); unknown[k] = (unknown[k] || 0) + 1; continue; }
    const d = cD >= 0 ? parseDate(r[cD]) : null;
    recs.push({ code, term: pr.term, price: pr.price, user: String(r[cU] || '(ไม่ระบุ)').trim().toUpperCase(), d, dk: d ? dKey(d) : 0 });
  }
  const dmap = {}; recs.forEach(x => { if (x.d) dmap[x.dk] = x.d; });
  const dates = Object.keys(dmap).map(Number).sort((a, b) => a - b).map(k => dmap[k]);
  return { recs, dates, format, total, outside, dup, unknown };
}

// Step 2: aggregate records for a date key (0 = all dates)
function aggregate(P, dk) {
  const recs = dk ? P.recs.filter(x => x.dk === dk) : P.recs;
  const loc = {}; Object.keys(LOCATIONS).forEach(k => loc[k] = { code: k, loc: LOCATIONS[k].short, fq: 0, fr: 0, yq: 0, yr: 0 });
  const staff = {};
  for (const x of recs) {
    const sk = x.user + '|' + x.code;
    const s = staff[sk] || (staff[sk] = { Username: x.user, code: x.code, loc: LOCATIONS[x.code].short, fq: 0, fr: 0, yq: 0, yr: 0 });
    for (const o of [loc[x.code], s]) { if (x.term === 'Free') { o.fq++; o.fr += x.price; } else { o.yq++; o.yr += x.price; } }
  }
  const fin = o => { o.tq = o.fq + o.yq; o.tr = o.fr + o.yr; return o; };
  const L = Object.values(loc).map(fin).sort((a, b) => b.tr - a.tr || b.tq - a.tq || a.loc.localeCompare(b.loc));
  const S = Object.values(staff).map(fin).sort((a, b) => b.tr - a.tr || b.tq - a.tq || a.Username.localeCompare(b.Username));
  const T = fin(['fq', 'fr', 'yq', 'yr'].reduce((t, k) => (t[k] = L.reduce((a, r) => a + r[k], 0), t), {}));
  const ds = dk ? P.dates.filter(d => dKey(d) === dk) : P.dates.slice();
  const fd = ds.length ? fileDate(ds) : 'NoDate';
  return { loc: L, staff: S, T, dateLabel: dateLabel(ds), fileDate: dk || ds.length < 2 ? fd : fileDate(ds.slice(0,1)).slice(0,2) + '-' + fd, mtd: !dk && ds.length > 1 };
}

// convenience (single shot, all dates)
function analyse(rows) { const P = parseRows(rows); return Object.assign(aggregate(P, 0), P); }

function buildPptx(D) {
  const RH_L = 0.3, RH_S = 0.25;
  const H = 0.4 + 0.9 + 0.3 + 1.3 + 0.45 + 0.5 + RH_L * (D.loc.length + 3) + 0.45 + 0.5 + RH_S * (D.staff.length + 2) + 0.6;
  const pres = new PptxGenJS();
  pres.defineLayout({ name: 'LONG', width: 10, height: Math.min(56, Math.ceil(H * 10) / 10) }); pres.layout = 'LONG';
  pres.theme = { headFontFace: 'Arial', bodyFontFace: 'Arial' };
  pres.title = 'Care Plus ' + (D.mtd ? 'MTD' : 'Daily') + ' Performance ' + D.dateLabel;
  const G = '0A5C36', G2 = '1E8C5A', LIME = '8DC63F', SAGE = 'C9DDB8', MIST = 'EEF5E6', INK = '1F2A24', MUTED = '5B6B63', T = D.T;
  const s = pres.addSlide(); s.background = { color: 'FFFFFF' };
  s.addShape(pres.shapes.RECTANGLE, { x: 0, y: 0, w: 10, h: 3.0, fill: { color: G }, line: { type: 'none' }, objectName: 'Header' });
  s.addText('Care Plus ' + (D.mtd ? 'MTD' : 'Daily') + ' Performance', { x: 0.5, y: 0.35, w: 9, h: 0.6, fontSize: 30, bold: true, color: 'FFFFFF', margin: 0, isTextBox: true });
  s.addText('AIS Shop Area South  •  ' + (D.mtd ? 'MTD ' : 'Order Date ') + D.dateLabel, { x: 0.5, y: 0.95, w: 9, h: 0.35, fontSize: 14, color: SAGE, margin: 0, isTextBox: true });
  const active = D.loc.filter(r => r.tq > 0).length;
  [{ lbl: 'Total Orders', v: fmt(T.tq), sub: active + ' locations • ' + D.staff.length + ' staff' },
   { lbl: 'Total Rev. (THB)', v: fmt(T.tr), sub: 'Free + 12M' },
   { lbl: 'Free (Monthly)', v: fmt(T.fq), sub: 'Rev. ' + fmt(T.fr) + ' THB', c: G2 },
   { lbl: '12M (Yearly)', v: fmt(T.yq), sub: 'Rev. ' + fmt(T.yr) + ' THB' }].forEach((c, i) => {
    const x = 0.5 + i * 2.3, y = 1.5;
    s.addShape(pres.shapes.ROUNDED_RECTANGLE, { x, y, w: 2.05, h: 1.25, rectRadius: 0.08, fill: { color: 'FFFFFF' }, line: { type: 'none' }, objectName: 'KPI ' + c.lbl });
    s.addText(c.lbl, { x: x + 0.18, y: y + 0.12, w: 1.75, h: 0.28, fontSize: 12, color: MUTED, margin: 0, isTextBox: true });
    s.addText(c.v, { x: x + 0.18, y: y + 0.4, w: 1.75, h: 0.5, fontSize: 28, bold: true, color: c.c || G, margin: 0, fit: 'shrink', isTextBox: true });
    s.addText(c.sub, { x: x + 0.18, y: y + 0.9, w: 1.8, h: 0.25, fontSize: 11, color: MUTED, margin: 0, isTextBox: true });
  });
  const hdr = (t, fill, col) => ({ text: t, options: { bold: true, color: col || 'FFFFFF', fill: { color: fill }, align: 'center', valign: 'middle' } });
  const headerRows = first => {
    const r1 = first.map(t => ({ text: t, options: { bold: true, color: 'FFFFFF', fill: { color: G }, valign: 'middle', rowspan: 2, align: t === '#' ? 'center' : 'left' } }));
    r1.push({ text: 'Free (Monthly)', options: { bold: true, color: INK, fill: { color: LIME }, align: 'center', colspan: 2 } });
    r1.push({ text: '12M (Yearly)', options: { bold: true, color: 'FFFFFF', fill: { color: G2 }, align: 'center', colspan: 2 } });
    r1.push({ text: 'Total', options: { bold: true, color: 'FFFFFF', fill: { color: G }, align: 'center', colspan: 2 } });
    return [r1, [hdr('Qty', SAGE, INK), hdr('Rev.', SAGE, INK), hdr('Qty', G2), hdr('Rev.', G2), hdr('Qty', G), hdr('Rev.', G)]];
  };
  const numCells = (r, fill, bold) => {
    const o = (v, b) => ({ text: v === 0 ? '-' : fmt(v), options: { align: 'right', fill: { color: fill }, bold: !!b || !!bold, color: v === 0 ? '9AA59F' : INK } });
    return [o(r.fq), o(r.fr), o(r.yq), o(r.yr), o(r.tq, true), o(r.tr, true)];
  };
  const tblOpt = (y, colW, rowH, fs) => ({ x: 0.5, y, w: 9, colW, rowH, fontSize: fs, fontFace: 'Arial', border: { type: 'solid', pt: 0.5, color: 'D5DED8' }, margin: [0, 0.08, 0, 0.08], valign: 'middle' });
  let y = 3.4;
  s.addText('By Location', { x: 0.5, y, w: 9, h: 0.4, fontSize: 20, bold: true, color: G, margin: 0, isTextBox: true });
  y += 0.5;
  let rows = headerRows(['#', 'Location']);
  D.loc.forEach((r, i) => { const f = i % 2 ? 'F4F8F0' : 'FFFFFF';
    rows.push([{ text: String(i + 1), options: { align: 'center', fill: { color: f } } }, { text: r.loc, options: { fill: { color: f } } }, ...numCells(r, f)]); });
  rows.push([{ text: 'Total Area South', options: { colspan: 2, bold: true, fill: { color: MIST } } }, ...numCells(T, MIST, true)]);
  s.addTable(rows, tblOpt(y, [0.4, 2.5, 0.75, 1.0, 0.75, 1.05, 0.85, 1.7], RH_L, 12));
  y += RH_L * (D.loc.length + 3) + 0.45;
  s.addText('By Staff', { x: 0.5, y, w: 9, h: 0.4, fontSize: 20, bold: true, color: G, margin: 0, isTextBox: true });
  y += 0.5;
  rows = headerRows(['#', 'Username', 'Location']);
  D.staff.forEach((r, i) => { const f = i % 2 ? 'F4F8F0' : 'FFFFFF';
    rows.push([{ text: String(i + 1), options: { align: 'center', fill: { color: f } } }, { text: r.Username, options: { fill: { color: f }, bold: true } },
      { text: r.loc, options: { fill: { color: f } } }, ...numCells(r, f)]); });
  if (!D.staff.length) rows.push([{ text: 'ไม่มีข้อมูล', options: { colspan: 9, align: 'center', color: MUTED } }]);
  s.addTable(rows, tblOpt(y, [0.4, 1.2, 2.2, 0.6, 0.85, 0.6, 1.0, 0.6, 1.55], RH_S, 11));
  y += RH_S * (Math.max(D.staff.length, 1) + 2) + 0.2;
  s.addText('Rev.: Free = ค่าบริการรายเดือนหลัง Free1M, 12M = ราคารายปี (ดึงจาก Product Name)', { x: 0.5, y, w: 9, h: 0.3, fontSize: 10, color: MUTED, margin: 0, isTextBox: true });
  return pres;
}
/* ===== END CORE ===== */

/* ===== UI ===== */
const $ = id => document.getElementById(id);
let DATA = null, PARSED = null;
$('locList').textContent = 'ดึงเฉพาะ: ' + Object.entries(LOCATIONS).map(([k, v]) => k + ' ' + v.short).join(' · ');

function showError(msg) { $('err').textContent = msg; $('err').hidden = false; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function headHTML(first) {
  return '<thead><tr>' + first.map(t => `<th class="g ${t === '#' ? '' : 'left'}" rowspan="2">${t}</th>`).join('') +
    '<th class="f" colspan="2">Free (Monthly)</th><th class="y" colspan="2">12M (Yearly)</th><th class="g" colspan="2">Total</th></tr>' +
    '<tr><th class="f2">Qty</th><th class="f2">Rev.</th><th class="y">Qty</th><th class="y">Rev.</th><th class="g">Qty</th><th class="g">Rev.</th></tr></thead>';
}
function numHTML(r) {
  const c = (v, b) => `<td class="n${v === 0 ? ' z' : ''}${b ? ' b' : ''}">${v === 0 ? '-' : fmt(v)}</td>`;
  return c(r.fq) + c(r.fr) + c(r.yq) + c(r.yr) + c(r.tq, 1) + c(r.tr, 1);
}
function render(D) {
  const T = D.T, active = D.loc.filter(r => r.tq > 0).length;
  $('meta').textContent = `· ${PARSED.format} · ${fmt(T.tq)} orders`;
  $('kpis').innerHTML = [
    ['Total Orders', fmt(T.tq), active + ' locations · ' + D.staff.length + ' staff', ''],
    ['Total Rev. (THB)', fmt(T.tr), 'Free + 12M', ''],
    ['Free (Monthly)', fmt(T.fq), 'Rev. ' + fmt(T.fr) + ' THB', 'free'],
    ['12M (Yearly)', fmt(T.yq), 'Rev. ' + fmt(T.yr) + ' THB', '']
  ].map(k => `<div class="kpi ${k[3]}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('');
  $('tLoc').innerHTML = headHTML(['#', 'Location']) + '<tbody>' +
    D.loc.map((r, i) => `<tr><td class="c">${i + 1}</td><td>${esc(r.loc)}</td>${numHTML(r)}</tr>`).join('') +
    `</tbody><tfoot><tr><td colspan="2">Total Area South</td>${numHTML(T)}</tr></tfoot>`;
  $('tStaff').innerHTML = headHTML(['#', 'Username', 'Location']) + '<tbody>' +
    (D.staff.length ? D.staff.map((r, i) => `<tr><td class="c">${i + 1}</td><td class="b">${esc(r.Username)}</td><td>${esc(r.loc)}</td>${numHTML(r)}</tr>`).join('')
      : '<tr><td colspan="9" class="c">ไม่มีข้อมูลของสาขาในความดูแล</td></tr>') + '</tbody>';
  const w = [];
  const P = PARSED;
  if (P.outside) w.push(`ตัดออก ${fmt(P.outside)} จาก ${fmt(P.total)} แถว (สาขานอกความดูแล)`);
  if (P.dup) w.push(`ตัด order_num ซ้ำ ${fmt(P.dup)} แถว`);
  const u = Object.entries(P.unknown);
  if (u.length) w.push(`ไม่นับ ${u.reduce((a, x) => a + x[1], 0)} แถว เพราะอ่าน Free/12M จาก Product Name ไม่ได้: ` + u.map(x => `${esc(x[0])} (${x[1]})`).join(', '));
  $('warn').innerHTML = w.join('<br>'); $('warn').hidden = !w.length;
  $('result').hidden = false;
}

function setDate(dk) { DATA = aggregate(PARSED, dk); render(DATA); }
function fillDates() {
  const sel = $('dateSel'), ds = PARSED.dates;
  sel.innerHTML = ds.slice().reverse().map(d => `<option value="${dKey(d)}">${dTxt(d)}</option>`).join('') +
    (ds.length > 1 ? `<option value="0">MTD ทุกวัน (${dateLabel(ds.slice())})</option>` : '');
  if (!ds.length) sel.innerHTML = '<option value="0">ทั้งไฟล์</option>';
  sel.value = ds.length ? String(dKey(ds[ds.length - 1])) : '0';   // default = latest day
  setDate(+sel.value);
}
function handleFile(file) {
  if (!file) return;
  $('err').hidden = true;
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let wb;
      if (isCsv) {
        const buf = new Uint8Array(e.target.result);
        let text;
        try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
        catch (_) { text = new TextDecoder('windows-874').decode(buf); }   // ไฟล์จากระบบ AIS เป็น TIS-620/cp874
        wb = XLSX.read(text, { type: 'string', raw: true });            // raw: keep codes/dates as text
      } else {
        wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      }
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      PARSED = parseRows(rows);
      fillDates();
    } catch (ex) { DATA = PARSED = null; $('result').hidden = true; showError(ex.message || 'อ่านไฟล์ไม่สำเร็จ'); }
  };
  reader.onerror = () => showError('อ่านไฟล์ไม่สำเร็จ ลองเลือกไฟล์ใหม่อีกครั้ง');
  reader.readAsArrayBuffer(file);
}
$('dateSel').addEventListener('change', e => setDate(+e.target.value));

const drop = $('drop');
$('file').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
$('btnClear').addEventListener('click', () => { DATA = PARSED = null; $('result').hidden = true; $('err').hidden = true; });
$('btnExport').addEventListener('click', async () => {
  if (!DATA) return;
  const b = $('btnExport'); b.disabled = true; b.textContent = 'กำลังสร้างไฟล์…';
  try { await buildPptx(DATA).writeFile({ fileName: `Care_Plus_${DATA.mtd ? 'MTD' : 'Daily'}_Performance_${DATA.fileDate}.pptx` }); }
  catch (ex) { showError('Export ไม่สำเร็จ: ' + ex.message); }
  finally { b.disabled = false; b.textContent = 'Export PowerPoint'; }
});
</script>
